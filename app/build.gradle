apply plugin: 'com.android.application'

// 依赖版本单一来源：dependencies 与 BuildConfig（设置页「关于」展示）共用
// 注意：jgit 主包文件名 app/libs/org.eclipse.jgit-<此版本>-stripped.jar 须与 jgitVersion 同步（见 app/libs/make-stripped-jgit-jar.sh）
def jgitVersion = '7.8.0.202609011348-r'
def jschVersion = '2.28.7'

// 构建溯源（参考 local-dream）：配置期经 providers.exec 读 git，configuration-cache 把这些调用当输入跟踪，
// commit 变化时自动失效重建；无 .git 的源码树降级为空串而不是构建失败。执行期（doLast）不能调 providers.exec
String gitInfo(String... args) {
    try {
        providers.exec {
            commandLine('git', *args)
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
    } catch (Exception ignored) {
        ''
    }
}

static String quoted(String v) {
    '"' + v.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

def gitCommit = gitInfo('rev-parse', 'HEAD').take(12)
def gitCommitTime = gitInfo('log', '-1', '--pretty=%cI')
def gitDirty = gitInfo('status', '--porcelain', '--ignore-submodules=dirty') ? true : false

android {
    namespace 'ts.realms.m2git'
    defaultConfig {
        applicationId "ts.realms.m2git"
        compileSdk 34
        //noinspection ExpiredTargetSdkVersion
        targetSdk 31
        minSdk 31
        versionCode 282
        versionName "1.8.8-pisces312"

        buildConfigField 'String', 'JGIT_VERSION', "\"${jgitVersion}\""
        buildConfigField 'String', 'JSCH_VERSION', "\"${jschVersion}\""
        buildConfigField 'String', 'GIT_COMMIT', quoted(gitCommit)
        buildConfigField 'String', 'GIT_COMMIT_TIME', quoted(gitCommitTime)
        buildConfigField 'boolean', 'GIT_DIRTY', gitDirty.toString()

        // compileSdk 应始终使用最新版本，但不会影响运行时行为。
        // targetSdk 决定了应用是否启用新系统的行为变化，更新时需充分测试。
        // minSdk 决定了应用的最低支持版本，设置过低可能增加开发和测试成本。

        // ABI：默认仅构建 arm64-v8a（真机与模拟器通用，模拟器经 ARM 转译可直接运行 arm 版）
        // 不用 ndk.abiFilters，改用 splits.abi；需要其他 ABI 时用 -PbuildAbi 手动指定
    }

    compileOptions {
        encoding = 'utf-8'
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
        dataBinding true
        buildConfig true
    }

    lint {
        abortOnError false
    }

    // debug 签名约定：默认 debug 证书（~/.android/debug.keystore）+ v3-only（minSdk 31 无需 v1/v2）
    signingConfigs {
        debug {
            enableV1Signing false
            enableV2Signing false
            enableV3Signing true
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // 支持按需构建单个 ABI：./gradlew assembleRelease -PbuildAbi=arm64-v8a
    // 不传 buildAbi 时默认仅构建 arm64-v8a
    if (project.hasProperty('buildAbi')) {
        splits.abi {
            enable true
            reset()
            include project.property('buildAbi')
            universalApk false
        }
    } else {
        splits.abi {
            enable true
            reset()
            include 'arm64-v8a'
            universalApk false
        }
    }

    packagingOptions {
        resources {
            excludes += ['**/plugin.properties']
            excludes += "META-INF/DEPENDENCIES"
            excludes += "META-INF/LICENSE*"
            excludes += "META-INF/NOTICE*"
            excludes += "META-INF/MANIFEST.MF"
        }
    }
}

configurations.configureEach {
    //  replace com.jcraft.jsch to com.github.mwiede:jsch
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        if (details.requested.group == "com.jcraft" && details.requested.name == "jsch") {
            details.useTarget("com.github.mwiede:jsch:${jschVersion}")
        }
    }
    exclude module: 'httpclient'
    exclude module: "org.eclipse.jgit"
}

//tasks.withType(JavaCompile).configureEach {
//    options.compilerArgs << "-Xlint:deprecation"
//}

dependencies {
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.annotation:annotation:1.8.2'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.vectordrawable:vectordrawable:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.12.0'

    // Jgit：主包 = 官方 jar 剥离 InflaterCache.class（补丁类在 app 源码，见 org/eclipse/jgit/{lib,compatible}/，
    // 重新生成 jar 用 app/libs/make-stripped-jgit-jar.sh）
    implementation files("libs/org.eclipse.jgit-${jgitVersion}-stripped.jar")
    implementation "org.eclipse.jgit:org.eclipse.jgit.ssh.jsch:${jgitVersion}"
    implementation "org.eclipse.jgit:org.eclipse.jgit.lfs:${jgitVersion}"

    // xercesImpl removed: Android 31+ has built-in SAX parser, no need for external xerces
    implementation("org.slf4j:slf4j-log4j12:2.0.16")
    implementation("com.github.tony19:logback-android:3.0.0")  // No appenders could be found for logger
    // guava removed: LocalCacheManager now uses LinkedHashMap instead of CacheBuilder

    // ViewModel and LiveData
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.7.0"
    implementation "androidx.lifecycle:lifecycle-livedata:2.7.0"
    implementation "androidx.lifecycle:lifecycle-runtime:2.7.0"

    implementation 'com.jakewharton.timber:timber:5.0.1'
    implementation "com.github.mwiede:jsch:${jschVersion}"
    implementation 'commons-io:commons-io:2.16.1'
    implementation 'com.nostra13.universalimageloader:universal-image-loader:1.9.5'
    implementation 'com.scottyab:secure-preferences-lib:0.1.7'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'


    //  Debug and Test
    debugImplementation 'com.facebook.stetho:stetho:1.6.0'
    debugImplementation 'com.facebook.stetho:stetho-timber:1.6.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
}
